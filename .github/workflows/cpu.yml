name: CPU acceptance
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.13'
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked ruff check --isolated --line-length 100 research/fetch_kernelbench_problems.py
      - run: uv run --locked kernelagent check --output artifacts/ci
      - run: uv run --locked python examples/worker_smoke.py
      - run: uv build --no-sources
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-${{ matrix.os }}-${{ matrix.python }}
          path: artifacts/ci
          if-no-files-found: error
      - name: dump pytest diagnostics to annotations
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = uv run --locked python -m pytest tests/ -q --tb=line -p no:cacheprovider 2>&1 | Out-String
          $lines = $out -split "`r?`n"
          $interesting = @($lines | Where-Object { $_ -match '^(FAILED|ERROR)\s' })
          $i = 0
          foreach ($f in $interesting) {
            $i++
            $safe = $f -replace '%', '%25' -replace "`r", ''
            if ($safe.Length -gt 300) { $safe = $safe.Substring(0, 300) }
            Write-Output "::error title=win-fail-$i::$safe"
          }
          if ($interesting.Count -eq 0) {
            $tail = ($lines | Where-Object { $_.Trim() -ne '' } | Select-Object -Last 12) -join ' || '
            if ($tail.Length -gt 500) { $tail = $tail.Substring(0, 500) }
            Write-Output "::error title=win-tail::$tail"
          }
