name: CPU acceptance
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.13'
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked ruff check --isolated --line-length 100 research/fetch_kernelbench_problems.py
      - run: uv run --locked kernelagent check --output artifacts/ci
      - run: uv run --locked python examples/worker_smoke.py
      - run: uv build --no-sources
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-${{ matrix.os }}-${{ matrix.python }}
          path: artifacts/ci
          if-no-files-found: error
      - name: dump pytest diagnostics to ci-diag branch
        if: >-
          failure() && runner.os == 'Windows' && github.ref == 'refs/heads/main'
        permissions:
          contents: write
        shell: pwsh
        run: |
          uv run --locked python -m pytest tests/ -q --tb=short -p no:cacheprovider 2>&1 | Out-File -Encoding utf8 pytest-win-diag.log
          git config user.name "ci-diag"
          git config user.email "ci-diag@users.noreply.github.com"
          git add pytest-win-diag.log
          git commit -m "ci diag: windows pytest log" --no-verify
          git push origin "HEAD:ci-diag"
