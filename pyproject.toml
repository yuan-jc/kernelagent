[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "kernelagent-evidence"
version = "0.1.0"
description = "Evidence-driven NVIDIA operator optimization: engineering foundation"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = []

[project.scripts]
kernelagent = "kernelagent.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "jsonschema>=4.23,<5", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/kernelagent"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/schemas", "/pyproject.toml", "/uv.lock", "/README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["research", "docs", ".local", "artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I"]
